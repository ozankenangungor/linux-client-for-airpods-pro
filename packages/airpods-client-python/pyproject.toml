[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airpods-client"
version = "0.1.1"
description = "Async Unix-socket client for the local airpods-hubd service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["airpods", "heart-rate", "asyncio", "unix-socket"]
authors = [
    { name = "Ozan Kenan Güngör" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ozankenangungor/linux-client-for-airpods-pro"
Repository = "https://github.com/ozankenangungor/linux-client-for-airpods-pro"
Issues = "https://github.com/ozankenangungor/linux-client-for-airpods-pro/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airpods_client = ["py.typed"]
