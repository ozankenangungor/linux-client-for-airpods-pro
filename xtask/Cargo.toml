[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
nix = { version = "0.30", features = ["signal", "process", "fs"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.9"
wait-timeout = "0.2"
zip = { version = "4", default-features = false, features = ["deflate"] }
