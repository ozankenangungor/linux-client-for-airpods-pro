name: Desktop distribution review

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source tag, branch, or commit to package
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # AlmaLinux 9.7 x86_64 manifest; glibc 2.34.
      image: docker.io/library/almalinux@sha256:7b72041988f07ef5020f7f5da036a9aad9165d996d02946bce29c9a38e99ba59
    steps:
      - name: Prepare container checkout tools
        run: dnf install -y git python3 tar xz gzip
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}
      - name: Trust checked-out source
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Record source revision
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          sha=$(git rev-parse HEAD)
          printf 'Requested source ref: %s\nResolved source SHA: %s\n' "$SOURCE_REF" "$sha"
          if [ "$SOURCE_REF" = v0.1.0 ] && [ "$sha" != bafc22b7e91f204fa6f84b33f2c96f57f828171b ]; then
            echo '::error::v0.1.0 does not match the reviewed release source' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Build and validate review artifacts
        run: python3 packaging/build-desktop-distribution.py --output dist/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: airpods-hr-appimage-review-${{ steps.source.outputs.sha }}
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 14
