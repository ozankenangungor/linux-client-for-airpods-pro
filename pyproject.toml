[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "airpods-hr-linux"
version = "0.1.1"
description = "Experimental AirPods Pro 3 heart-rate access for Linux"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["airpods", "heart-rate", "linux", "bluetooth"]
authors = [
    { name = "Ozan Kenan Güngör" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bumble==0.0.234",
    "dbus-next>=0.2.3",
]

[project.urls]
Homepage = "https://github.com/ozankenangungor/linux-client-for-airpods-pro"
Repository = "https://github.com/ozankenangungor/linux-client-for-airpods-pro"
Issues = "https://github.com/ozankenangungor/linux-client-for-airpods-pro/issues"

[project.optional-dependencies]
handoff-probe = [
    "bumble==0.0.234",
    "dbus-next>=0.2.3",
]

[project.scripts]
airpods-hr = "airpods_hr.cli:main"
airpods-hubd = "airpods_hr._hubd.main:main"
airpods-hubd-service = "airpods_hr.service_installer:main"

[tool.maturin]
compatibility = "manylinux_2_34"
manifest-path = "crates/airpods-aap-py/Cargo.toml"
python-source = "src"
python-packages = ["airpods_hr"]
module-name = "airpods_hr._airpods_aap_core"
bindings = "pyo3"
include = [{ path = "LICENSE", format = "sdist" }]
exclude = ["**/tests/**", "**/__pycache__/**", "**/*.pyc"]
