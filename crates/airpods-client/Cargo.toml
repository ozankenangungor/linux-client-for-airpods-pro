[package]
name = "airpods-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Async Unix-socket client for the local airpods-hubd service"
readme = "README.md"
exclude = ["examples/integration_probe.rs"]

[dependencies]
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-util", "net", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
