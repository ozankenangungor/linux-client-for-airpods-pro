[package]
name = "airpods-client"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Async Unix-socket client for the local airpods-hubd service"
readme = "README.md"
repository = "https://github.com/ozankenangungor/linux-client-for-airpods-pro"
homepage = "https://github.com/ozankenangungor/linux-client-for-airpods-pro"
authors = ["Ozan Kenan Güngör"]
keywords = ["airpods", "heart-rate", "linux", "async", "unix-socket"]
categories = ["asynchronous", "network-programming"]
exclude = ["examples/integration_probe.rs"]

[dependencies]
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-util", "net", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
