[package]
name = "airpodsctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Local command-line client for airpods-hubd"
readme = "README.md"
repository = "https://github.com/ozankenangungor/airpods-hr-linux"
homepage = "https://github.com/ozankenangungor/airpods-hr-linux"

[dependencies]
airpods-client = { path = "../airpods-client" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt", "signal"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["io-util", "net", "time"] }
