[package]
name = "airpods-aap-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Private Python bindings for airpods-aap-core"
publish = false

[lib]
name = "_airpods_aap_core"
crate-type = ["cdylib"]

[dependencies]
airpods-aap-core = { path = "../airpods-aap-core" }
airpods-hub-core = { path = "../airpods-hub-core" }
airpods-sdp-core = { path = "../airpods-sdp-core" }
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
serde_json = "1"
